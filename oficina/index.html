        <form action="/src/server.ts" method="get">

    <script>

        const form = document.getElementById('formulariosfoda')
        const nameInput = document.getElementById('nameInput')

        let currentName = ''

        nameInput.addEventListener('onchange', (ev) => {
            ev.preventDefault()
            currentName = ev.target.value;
        })

        form.addEventListener('submit', function (evento) {
            evento.preventDefault(); // "não recarregue a página, deixa comigo"
            handler();
        });

        const handler = () => {
            const url = 'http://localhost:8080/cliente';
            fetch(url,{
            method: 'POST',
            headers: {ContentType: 'application/json'},
            body: JSON.stringify({
                nome: 'John Doe',
                email: 'john.doe@example.com',
                telefone: '123456789',
                cpf: '123.456.789-00'
            }), 
    })
        }
    

</script>
